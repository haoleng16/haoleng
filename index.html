<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>helin</title>
  </head>
  <body>
    <!-- GitHub Pages SPA redirect receiver: 404.html encodes the requested path
         into ?/<path>. Here we restore it into the real URL before React mounts. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          // decoded is "blog?query..." (path AFTER the repo segment). Re-add the
          // repo prefix (e.g. /haoleng/) so React Router sees the full route.
          var repoSegment = l.pathname.replace(/\/$/, ''); // "/haoleng"
          window.history.replaceState(
            null,
            null,
            repoSegment + '/' + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

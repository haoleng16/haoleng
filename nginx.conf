# ===== nginx config =====
# SPA static serving + reverse proxy /api → backend container
#
# HTTPS: this config ships an HTTP-only setup. After you obtain certs with
# certbot (see deploy steps), uncomment the HTTPS server block below.

# Use Docker's embedded DNS resolver (127.0.0.11) so backend name resolution is
# retried at request time instead of failing hard at startup.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name haoleng.art www.haoleng.art;

    # ---- certbot renewal challenge (HTTP-01) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- API: reverse proxy to backend ----
    # Frontend calls /api/agent/chat → proxied to http://backend:8000/api/agent/chat
    # Using a variable in proxy_pass forces nginx to use the resolver above and
    # resolve the backend name at request time (so nginx won't crash if the
    # backend container isn't up yet at startup).
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent endpoint is a streaming (SSE) response — disable buffering
        # and allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Static SPA ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: serve index.html for any client-side route
        try_files $uri $uri/ /index.html;
    }

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ===== HTTPS server block — UNCOMMENT AFTER OBTAINING CERTS =====

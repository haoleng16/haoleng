<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>helin</title>
  </head>
  <body>
    <!-- GitHub Pages SPA redirect receiver. 404.html encodes the originally
         requested path into the query as ?/<path>&<query>. Here we decode it
         back into a real URL (with the repo segment prepended) before React
         mounts, so React Router sees the correct route. This runs once. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          // decoded looks like "/blog?key=val..." — prepend the repo path so the
          // final URL is e.g. /haoleng/blog?key=val (strip trailing slash first
          // to avoid a double slash).
          window.history.replaceState(
            null,
            null,
            l.pathname.replace(/\/$/, '') + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
